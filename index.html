    <!--
      Tres tipografías dibujadas para pantalla, no para papel. Inter para todo
      el texto de trabajo: se diseñó para interfaces y tiene el ojo alto, que
      es lo que hace que se lea de lejos. Roboto Condensed para los títulos
      —mantiene el aire de cartelería vial del taller— y Roboto Mono para
      patentes, CUIT, códigos y N° de OT.

      Se cambiaron las anteriores (Barlow / IBM Plex) porque en Windows salían
      lavadas: están dibujadas con más gracia que ajuste a la grilla de píxeles,
      y a 100% de escala el trazo fino queda gris en vez de negro.

      Si no hay internet caen a la tipografía del sistema y la app sigue igual.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap"
